services:
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEBAPP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${VIDEO_ROOT:?VIDEO_ROOT is required. Copy .env.example to .env and set an absolute video directory.}
        target: /videos
        read_only: true
      - type: bind
        source: ${VIDEO_ROOT:?VIDEO_ROOT is required. Copy .env.example to .env and set an absolute video directory.}/Cuts
        target: /videos-cuts
        read_only: false
      - thumbnail_cache:/previews
      - ./:/workspace
      - /workspace/WebApp/WebApp/bin
      - /workspace/WebApp/WebApp/obj
      - /workspace/WebApp/WebApp.Client/bin
      - /workspace/WebApp/WebApp.Client/obj
      - /workspace/WebApp.Tests/bin
      - /workspace/WebApp.Tests/obj
      - nuget_cache:/root/.nuget/packages
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER: "true"
      VideoLibrary__Path: /videos
      ThumbnailCache__Path: /previews
      VideoCut__Path: /videos-cuts
      # Optional: set to "false" to disable hover-preview generation and serving entirely.
      # HoverPreview__Enabled: "true"

volumes:
  nuget_cache:
  thumbnail_cache:
