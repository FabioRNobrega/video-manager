services:
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEBAPP_PORT:-8080}:8080"
    # Rootless Podman's default DNS auto-detection here forwards to the host's systemd-resolved
    # loopback stub (127.0.0.53), which is unreachable from the container's own network namespace,
    # so hostname lookups (e.g. NuGet restore) hang and time out even though outbound connectivity
    # itself works. Pointing at public resolvers directly avoids the broken auto-detected upstream.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - type: bind
        source: ${VIDEO_ROOT:-/home/PereneArchive}
        target: /archive
        read_only: false
      - thumbnail_cache:/previews
      - ./:/workspace
      - /workspace/WebApp/WebApp/bin
      - /workspace/WebApp/WebApp/obj
      - /workspace/WebApp/WebApp.Client/bin
      - /workspace/WebApp/WebApp.Client/obj
      - /workspace/WebApp.Tests/bin
      - /workspace/WebApp.Tests/obj
      - nuget_cache:/root/.nuget/packages
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER: "true"
      ArchiveRoot__Path: /archive
      VideoLibrary__Path: /archive/Videos
      ThumbnailCache__Path: /previews
      VideoCut__Path: /archive/Videos/Cuts
      VideoComposition__Path: /archive/Videos/VideoComposition
      AllowedNetworkHosts__Hosts: ${ALLOWED_NETWORK_HOSTS:-}
      # Optional: set to "false" to disable hover-preview generation and serving entirely.
      # HoverPreview__Enabled: "true"

volumes:
  nuget_cache:
  thumbnail_cache:
