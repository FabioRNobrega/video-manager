services:
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${WEBAPP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${VIDEO_ROOT:?VIDEO_ROOT is required. Copy .env.example to .env and set an absolute video directory.}
        target: /videos
        read_only: true
      - ./:/workspace
      - /workspace/WebApp/WebApp/bin
      - /workspace/WebApp/WebApp/obj
      - /workspace/WebApp/WebApp.Client/bin
      - /workspace/WebApp/WebApp.Client/obj
      - /workspace/WebApp.Tests/bin
      - /workspace/WebApp.Tests/obj
      - nuget_cache:/root/.nuget/packages
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER: "true"
      VideoLibrary__Path: /videos

volumes:
  nuget_cache:
